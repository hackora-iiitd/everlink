[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "everlink-backend"
version = "0.1.0"
description = "Everlink: University ecosystem discovery platform"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.109.0",
    "uvicorn[standard]==0.27.0",
    "pydantic==2.5.0",
    "pydantic-settings==2.1.0",
    "neo4j==5.14.1",
    "python-dotenv==1.0.0",
    "pytest==7.4.3",
    "httpx==0.25.2",
    "python-multipart==0.0.6",
]

[project.optional-dependencies]
dev = ["pytest-asyncio==0.21.1", "black==23.12.0", "ruff==0.1.11"]
